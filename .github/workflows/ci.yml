name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: rogue
          POSTGRES_USER: rogue
          POSTGRES_PASSWORD: rogue_dev_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rogue -d rogue"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ROGUE_DATABASE_URL: postgresql+psycopg://rogue:rogue_dev_only@localhost:5432/rogue
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: mypy
        run: mypy backend/rogue && mypy agents

      - name: Run migrations
        run: alembic upgrade head

      - name: pytest
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test
