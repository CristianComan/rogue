services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rogue}
      POSTGRES_USER: ${POSTGRES_USER:-rogue}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-rogue_dev_only}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-rogue} -d ${POSTGRES_DB:-rogue}"]
      interval: 5s
      timeout: 5s
      retries: 10

  nats:
    image: nats:2.10-alpine
    command: ["-js", "-m", "8222", "--store_dir", "/data"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR_PORT:-8222}:8222"
    volumes:
      - nats-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8222/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-rogue}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-rogue_dev_password}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:latest
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set rogue http://minio:9000
      ${MINIO_ROOT_USER:-rogue}
      ${MINIO_ROOT_PASSWORD:-rogue_dev_password}; do sleep 2; done;
      mc mb --ignore-existing rogue/${MINIO_BUCKET:-rogue};
      exit 0;
      "

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ROGUE_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-rogue}:${POSTGRES_PASSWORD:-rogue_dev_only}@postgres:5432/${POSTGRES_DB:-rogue}
      ROGUE_NATS_URL: nats://nats:4222
      ROGUE_S3_ENDPOINT: http://minio:9000
      ROGUE_S3_BUCKET: ${MINIO_BUCKET:-rogue}
      ROGUE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-rogue}
      ROGUE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-rogue_dev_password}
      ROGUE_CORS_ALLOWED_ORIGINS: http://localhost:${ROGUE_UI_PORT:-5173}
      # Dispatches over NATS to the real, separate simulated-agent-* processes
      # below instead of an in-process MockSDRAdapter (M8, ADR-008). Every
      # unit test still exercises "in_process" (the default) unchanged.
      ROGUE_AGENT_DISPATCH_MODE: distributed
    ports:
      - "${ROGUE_API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  tiles:
    image: maptiler/tileserver-gl:latest
    command: ["--file", "/data/berlin.mbtiles"]
    volumes:
      - ./map-tiles:/data:ro
    ports:
      - "${ROGUE_TILES_PORT:-8081}:8080"

  ui:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      VITE_API_BASE_URL: http://localhost:${ROGUE_API_PORT:-8000}
      # Self-hosted basemap (scripts/build_map_tiles.sh + the `tiles`
      # service above) — like VITE_API_BASE_URL, this is read by the Vite
      # dev server but shipped into client-side JS that runs in the
      # operator's browser on the host, so it must be the host-published
      # port (localhost:8081), not the tiles service's in-network address.
      VITE_MAP_STYLE_URL: http://localhost:${ROGUE_TILES_PORT:-8081}/styles/basic-preview/style.json
    ports:
      - "${ROGUE_UI_PORT:-5173}:5173"
    depends_on:
      - api
      - tiles

  # Two instances, each owning a disjoint slice of DEFAULT_CAPABILITY_PROFILE's
  # device_ids (M8, ADR-008) — pairs one simulated X440 with one simulated
  # AIR7311 per "agent host", and means the control plane's device_id->
  # agent_id registry lookup actually has to pick between two real answers
  # instead of always resolving to the only agent that exists.
  simulated-agent-1:
    build:
      context: .
      dockerfile: agents/Dockerfile
    environment:
      ROGUE_NATS_URL: nats://nats:4222
      ROGUE_AGENT_ID: sim-agent-01
      ROGUE_AGENT_MODE: simulated
      ROGUE_AGENT_DEVICE_IDS: x440-1,air7311-1
      ROGUE_S3_ENDPOINT: http://minio:9000
      ROGUE_S3_BUCKET: ${MINIO_BUCKET:-rogue}
      ROGUE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-rogue}
      ROGUE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-rogue_dev_password}
    depends_on:
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  simulated-agent-2:
    build:
      context: .
      dockerfile: agents/Dockerfile
    environment:
      ROGUE_NATS_URL: nats://nats:4222
      ROGUE_AGENT_ID: sim-agent-02
      ROGUE_AGENT_MODE: simulated
      ROGUE_AGENT_DEVICE_IDS: x440-2,air7311-2
      ROGUE_S3_ENDPOINT: http://minio:9000
      ROGUE_S3_BUCKET: ${MINIO_BUCKET:-rogue}
      ROGUE_S3_ACCESS_KEY: ${MINIO_ROOT_USER:-rogue}
      ROGUE_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-rogue_dev_password}
    depends_on:
      nats:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

volumes:
  postgres-data:
  minio-data:
  nats-data:
