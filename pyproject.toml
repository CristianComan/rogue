[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "rogue-hil"
version = "0.1.0"
description = "ROGUE - RF Operations Generator for Unified Experimentation"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
  { name = "ROGUE contributors" }
]
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
  "geoalchemy2>=0.15,<1.0",
  "shapely>=2.0,<3.0",
  "pyproj>=3.6,<4.0",
  "nats-py>=2.8,<3.0",
  "boto3>=1.35,<2.0",
  "httpx>=0.27,<1.0",
  "orjson>=3.10,<4.0",
  "pyyaml>=6.0,<7.0",
  "numpy>=2.0,<3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "pytest-cov>=5.0,<7.0",
  "hypothesis>=6.0,<7.0",
  "ruff>=0.6,<1.0",
  "mypy>=1.11,<2.0",
  "types-PyYAML>=6.0,<7.0",
  "pre-commit>=3.8,<5.0"
]

[tool.hatch.build.targets.wheel]
packages = ["backend/rogue"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["backend", "agents", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
mypy_path = ["backend", "agents"]

[[tool.mypy.overrides]]
module = ["boto3.*", "geoalchemy2.*", "nats.*"]
ignore_missing_imports = true
